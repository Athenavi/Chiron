# Alertmanager 配置
# 用于多租户 SaaS AI Agent 平台的告警通知

global:
  resolve_timeout: 5m
  # SMTP 配置（生产环境需要设置）
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'alerts@chiron.example.com'
  # smtp_auth_username: 'alerts@chiron.example.com'
  # smtp_auth_password: '${SMTP_PASSWORD}'

route:
  group_by: ['alertname', 'severity', 'component']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'
  
  routes:
    # 严重告警立即发送，1小时后重复
    - match:
        severity: critical
      receiver: 'critical-alerts'
      repeat_interval: 1h
      continue: true
    
    # 警告级别告警
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 4h
      continue: true
    
    # 信息级别告警（不发送通知，仅记录）
    - match:
        severity: info
      receiver: 'info-logging'
      repeat_interval: 24h

receivers:
  # 默认接收器（开发环境使用日志）
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://localhost:9094/webhook'
        send_resolved: true

  # 严重告警接收器
  - name: 'critical-alerts'
    # 邮件通知（生产环境启用）
    # email_configs:
    #   - to: 'ops-team@example.com'
    #     send_resolved: true
    #     headers:
    #       Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
    
    # Slack 通知（可选）
    # slack_configs:
    #   - api_url: '${SLACK_WEBHOOK_URL}'
    #     channel: '#chiron-critical'
    #     title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
    #     send_resolved: true
    
    # PagerDuty 通知（可选）
    # pagerduty_configs:
    #   - service_key: '${PAGERDUTY_SERVICE_KEY}'
    
    # Webhook（自定义处理）
    webhook_configs:
      - url: 'http://localhost:9094/critical-webhook'
        send_resolved: true

  # 警告级别接收器
  - name: 'warning-alerts'
    # Slack 通知
    # slack_configs:
    #   - api_url: '${SLACK_WEBHOOK_URL}'
    #     channel: '#chiron-warnings'
    #     title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
    #     send_resolved: true
    
    webhook_configs:
      - url: 'http://localhost:9094/warning-webhook'
        send_resolved: true

  # 信息级别接收器（仅记录）
  - name: 'info-logging'
    webhook_configs:
      - url: 'http://localhost:9094/info-webhook'
        send_resolved: false

# 抑制规则：避免告警风暴
inhibit_rules:
  # 如果基础设施故障，抑制相关的业务告警
  - source_match:
      severity: critical
      component: database
    target_match:
      severity: warning
    equal: ['alertname']

  # 如果 Python Engine 宕机，抑制 LLM 相关告警
  - source_match:
      alertname: PythonEngineDown
    target_match:
      component: llm
    equal: ['severity']
